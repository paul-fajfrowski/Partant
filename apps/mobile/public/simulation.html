<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partant — simulation mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efefec;color:#141414;font-family:system-ui,-apple-system,sans-serif}header{padding:18px 24px;border-bottom:1px solid #dcdcd8;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}strong{font-size:23px;letter-spacing:-1px}label{font-size:12px;color:#626262;display:flex;align-items:center;gap:8px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button,a{font:inherit;font-size:13px;color:#141414;background:#fff;border:1px solid #d4d4cf;border-radius:99px;padding:10px 14px;min-height:44px;text-decoration:none}button,a,select{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #141414;outline-offset:3px}.hint{font-size:12px;color:#626262;text-align:center;margin:12px 16px;line-height:1.6}.stage{display:flex;justify-content:center;align-items:flex-start;padding:8px 12px 20px}.sizer{position:relative}.device{position:absolute;left:0;top:0;transform-origin:top left;border:8px solid #141414;border-radius:40px;overflow:hidden;background:#fff}.status{height:28px;background:#fff;padding:7px 21px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:600}.screen{display:block;border:0;background:#fff;width:100%}.home{height:16px;display:grid;place-items:center;background:white}.home:after{content:"";height:4px;width:110px;border-radius:10px;background:#141414}.label{font-size:11px;color:#626262;letter-spacing:.08em;text-transform:uppercase} @media(max-width:600px){header{padding:12px;gap:10px}nav{gap:6px}label{font-size:11px}select,button,a{font-size:12px;padding:8px 10px}.hint{margin:8px}}
</style>
</head>
<body>
<header><div><strong>partant</strong><div class="label">Simulation mobile · locale</div></div><nav aria-label="Réglages de simulation"><label>Écran<select id="size"><option value="390,844">390 × 844 · iPhone</option><option value="430,932">430 × 932 · grand iPhone</option><option value="412,915">412 × 915 · Android</option><option value="768,1024">768 × 1024 · tablette</option></select></label><label>Données<select id="mode"><option value="demo">Démonstration</option><option value="connected">Supabase · comptes réels</option></select></label><a href="recette.html?autoplay=1">Voir la recette en direct ▶</a><button id="reload" type="button">Actualiser</button><a id="outside" href="/" target="_blank" rel="noopener">Ouvrir hors cadre ↗</a></nav></header>
<p class="hint" id="hint">Application interactive au format téléphone. Les modifications du code sont visibles après reconstruction et actualisation.</p>
<main class="stage"><div class="sizer"><div class="device"><div class="status" aria-hidden="true"><span>9:41</span><span>●●● &nbsp; Wi-Fi &nbsp; ▰</span></div><iframe class="screen" title="Application Partant interactive" id="app" allow="clipboard-write"></iframe><div class="home" aria-hidden="true"></div></div></div></main>
<script>
const size=document.getElementById('size'),mode=document.getElementById('mode'),app=document.getElementById('app'),outside=document.getElementById('outside');
mode.value=new URLSearchParams(location.search).get('mode')==='connected'?'connected':'demo';
function fit(){const[w,h]=size.value.split(',').map(Number);const width=w+16,height=h+60;const top=document.querySelector('.stage').getBoundingClientRect().top;const scale=Math.min(1,(innerWidth-24)/width,Math.max(250,innerHeight-top-24)/height);const device=document.querySelector('.device'),sizer=document.querySelector('.sizer');device.style.width=width+'px';device.style.transform='scale('+scale+')';app.style.height=h+'px';sizer.style.width=width*scale+'px';sizer.style.height=height*scale+'px';}
function load(){const url=mode.value==='connected'?'/?data=connected':'/?data=preview';app.src=url;outside.href=url;history.replaceState(null,'','?mode='+mode.value);document.getElementById('hint').textContent=mode.value==='connected'?'Comptes et données Supabase. Pour Google ou Apple, utilisez « Ouvrir hors cadre » : les fournisseurs peuvent refuser une connexion dans un cadre.':'Démonstration interactive · comptes fictifs · code 123456 · aucun paiement ni e-mail. Le rendu web ne remplace pas un test natif.';fit();}
size.addEventListener('change',fit);mode.addEventListener('change',load);document.getElementById('reload').addEventListener('click',()=>{app.src=outside.getAttribute('href')});window.addEventListener('resize',fit);load();
</script>
</body></html>
