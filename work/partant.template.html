function prior_card(c){let slots=matchingSlots(c);return `<article class="coach-card" aria-label="${esc(c.name)}"><div class="portrait photo person-${c.id} p${c.photoIndex??c.id%6}"><button class="full" style="height:100%;position:absolute;inset:0" data-action="profile" data-id="${c.id}" aria-label="Voir le profil de ${esc(c.name)}"></button><button class="iconbtn fav" data-action="fav" data-id="${c.id}" aria-label="${state.favorites.includes(c.id)?'Retirer':'Ajouter'} ${esc(c.name)} ${state.favorites.includes(c.id)?'des':'aux'} favoris" aria-pressed="${state.favorites.includes(c.id)}">${state.favorites.includes(c.id)?'<span style="font-size:25px">♥</span>':ic('heart')}</button><span class="tag">${ic('shield','sm')} Profil vérifié</span></div><div class="card-info"><div class="row between"><button style="padding:0;text-align:left;min-height:44px" data-action="profile" data-id="${c.id}"><h3>${esc(c.name)}</h3></button><span class="review">★ ${c.rating} <span class="muted">(${c.reviews})</span></span></div><div class="row between"><p>${esc(c.sport)}</p><div><span class="price">${price(c)+(c.id===activeCoachId&&state.format==='Domicile'?cfg.travelFee:0)} €</span><span class="small muted"> / ${primaryService(c.id).duration} min</span></div></div><p>${esc(c.area)} <span aria-hidden="true">·</span> ${c.dist.toString().replace('.',',')} km</p></div><div class="slots-label">${ic('clock','sm')} ${state.day===todayIndex()?"Aujourd’hui":state.day===todayIndex()+1?'Demain':days[state.day].short+' '+days[state.day].num}${state.hour?' · '+state.hour:''} <span class="muted">· Réservation immédiate</span></div><div class="slots">${slots.slice(0,3).map(t=>`<button class="slot" data-action="book" data-id="${c.id}" data-time="${t}" aria-label="Réserver ${esc(c.name)}, ${days[state.day].long} à ${t}">${t}</button>`).join('')}<button class="slot more" data-action="profile" data-id="${c.id}" aria-label="Toutes les disponibilités de ${esc(c.name)}">${ic('arrow','sm')}</button></div><div class="card-bottom"><span class="small muted">${c.formats.slice(0,2).join(' · ')}${c.id===activeCoachId&&cfg.travelFee&&state.format!=='Domicile'?' · domicile + '+cfg.travelFee+' €':' · Tout compris'}</span><button data-action="compare-add" data-id="${c.id}" aria-pressed="${state.comp.includes(c.id)}">${state.comp.includes(c.id)?'✓ Sélectionné':'+ Comparer'}</button></div></article>`}
function prior_results(){let list=legacyResults();if(state.sort==='recommended'&&customer.done){let goals={'Me remettre en forme':['Remise en forme','Renforcement'],'Gagner en force':['Musculation','Renforcement'],'Me sentir mieux':['Yoga','Pilates'],'Préparer une course':['Running','Préparation compétition'],'Améliorer ma mobilité':['Mobilité'],'Perdre du poids':['Perte de poids']},tags=goals[customer.goal]||[];let score=c=>tags.some(t=>[c.sport,...c.tags].includes(t))?1:0;list.sort((a,b)=>score(b)-score(a)||a.dist-b.dist)}return list}
function activeFilters(){let chips=[];if(state.maxPrice<300)chips.push(['budget','Jusqu’à '+state.maxPrice+' €']);if(state.maxDist<10)chips.push(['distance',state.maxDist+' km max.']);if(state.format!=='Tous')chips.push(['format',state.format]);if(!['Tout','Running','Pilates','Musculation','Boxe','Yoga'].includes(state.sport))chips.push(['sport',state.sport]);return chips.length?`<div class="scrollrow" style="padding:12px 24px 0">${chips.map(([id,t])=>`<button class="chip" data-action="clear-filter" data-id="${id}" aria-label="Retirer le filtre ${t}">${t} ×</button>`).join('')}</div>`:''}
function explore(){let list=results();return `<header class="top"><div class="row between"><div class="wordmark">partant</div><button class="row place" data-action="location">${ic('pin','sm')}${esc(state.city)} ${ic('down','sm')}</button></div><h1>On bouge quand ?</h1><p class="sub">Trouvez votre coach. Réservez votre moment.</p><div class="scrollrow"><button class="chip ${state.day===todayIndex()&&state.period==='all'&&!state.hour?'active':''}" data-action="time" data-id="today">Aujourd’hui</button><button class="chip ${state.day===todayIndex()&&state.period==='evening'?'active':''}" data-action="time" data-id="evening">Ce soir</button><button class="chip ${state.day===todayIndex()+1&&!state.hour?'active':''}" data-action="time" data-id="tomorrow">Demain</button><button class="chip ${state.hour||state.day>todayIndex()+1?'active':''}" data-action="date">${ic('calendar','sm')} ${state.hour||state.day>todayIndex()+1?days[state.day].short+' '+days[state.day].num+(state.hour?' · '+state.hour:''):'Date & heure'}</button></div></header><div class="sheet"><div class="scrollrow sports">${[['Tout','all'],['Running','run'],['Pilates','pilates'],['Musculation','strength'],['Boxe','boxing'],['Yoga','yoga'],['Autres','plus']].map(([s,i])=>`<button class="sport ${state.sport===s?'active':''}" data-action="sport" data-id="${s}">${ic(i,'sport-symbol')}${s}</button>`).join('')}</div><form class="searchbar" id="search-form">${ic('search','sm')}<input id="search" aria-label="Rechercher un sport, un coach ou un quartier" placeholder="Un sport, un coach, un quartier" value="${esc(state.query)}"><button class="iconbtn" type="button" data-action="filters" aria-label="Filtres">${ic('filter')}</button></form>${activeFilters()}<div class="results-head row between"><div><h2>${state.period==='evening'?'Votre séance de ce soir':'Des coachs, tout près.'}</h2><p><span class="result-count">${list.length}</span> ${list.length===1?'disponible':'disponibles'} · ${days[state.day].short} ${days[state.day].num} ${days[state.day].d.toLocaleDateString('fr-FR',{month:'short'})}${state.hour?' à '+state.hour:''}</p></div><div class="row"><button class="textbtn" data-action="sort">Trier</button><button class="iconbtn soft" data-action="map" aria-label="${state.map?'Voir la liste':'Voir la carte'}">${ic(state.map?'all':'map','sm')}</button></div></div>${state.comp.length?`<div class="compare-bar row between"><span class="small">${state.comp.length}/2 coachs sélectionnés</span><button data-action="compare" ${state.comp.length<2?'disabled':''}>Comparer →</button></div>`:''}${state.map?mapView(list):list.length?list.map(card).join(''):`<div class="empty">${ic('search')}<h2>${!state.city.startsWith('Paris')&&state.format!=='Visio'?'Pas encore de coach dans ce secteur':'Aucun coach sur ce créneau'}</h2><p>${!state.city.startsWith('Paris')&&state.format!=='Visio'?'Les profils fictifs de la démo sont à Paris. Votre secteur est enregistré ; vous pouvez rechercher une séance en visio.':'Essayez une autre heure, un budget plus large ou une séance en visio.'}</p>${!state.city.startsWith('Paris')&&state.format!=='Visio'?'<button class="pill" data-action="search-visio">Voir les coachs en visio</button>':''}<button class="pill" data-action="reset-filters">Élargir ma recherche</button><button class="textbtn" data-action="date">Choisir une autre date</button></div>`}<div class="app-footer">Des coachs indépendants. Du temps pour vous.<br><br>Démo · profils et créneaux fictifs</div></div>`}
function go(screen){if(state.screen!==screen)state.history.push({screen:state.screen,coach:state.coach});state.screen=screen;render();view.scrollTop=0;view.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;act(b.dataset.action,b.dataset)});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();state.query=document.getElementById('search').value;render()}});
function showModal(title,html){document.getElementById('modal-content').innerHTML=`<header class="dialog-head"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Fermer">${ic('close')}</button></header><div class="dialog-body">${html}</div>`;if(!modal.open)modal.showModal()}
function closeModal(){modal.close()}
function pagebar(t,extra=''){return `<div class="pagebar"><button class="iconbtn" data-action="back" aria-label="Retour">${ic('back')}</button><strong>${t}</strong><div class="right">${extra}</div></div>`}
function empty(title,copy,action='nav',id='explore',label='Explorer les coachs'){return `<div class="empty">${ic('calendar')}<h2>${title}</h2><p>${copy}</p><button class="pill" data-action="${action}" data-id="${id}">${label}</button></div>`}
function dayLabel(d){if(days[d])return days[d].long;let date=new Date(base);date.setDate(date.getDate()+d);return date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function dateStrip(selected,action){return `<div class="scrollrow" aria-label="Choisir un jour">${days.map((d,i)=>`<button class="datebtn ${i===selected?'active':''}" data-action="${action}" data-id="${i}" aria-label="${d.long}" aria-pressed="${i===selected}"><span>${d.short}</span><b>${d.num}</b></button>`).join('')}</div>`}
function prior_profile(){let c=coaches[state.coach],pd=state.profileDay??state.day;let slots=avail(c,pd);return `${pagebar('Votre coach',`<button class="iconbtn" data-action="fav" data-id="${c.id}" aria-label="${state.favorites.includes(c.id)?'Retirer des':'Ajouter aux'} favoris">${state.favorites.includes(c.id)?'♥':ic('heart')}</button>`)}<div class="detail-photo photo person-${c.id} p${c.photoIndex??c.id%6}" role="img" aria-label="Portrait de ${esc(c.name)}"></div><div class="profile-sheet section"><div class="row between"><span class="badge">${ic('shield','sm')} Profil vérifié</span><span class="review">★ ${c.rating} · <button class="textbtn" data-action="profile-reviews">${c.reviews} avis</button></span></div><h1 style="margin:16px 0 6px">${esc(c.name)}</h1><p class="muted">${esc(c.sport)} · ${esc(c.area)}</p><h2 style="margin:22px 0 12px;font-size:22px">« ${esc(c.quote)} »</h2><div class="row wrap">${c.tags.map(t=>`<span class="badge">${t}</span>`).join('')}</div><div class="stats"><div><b>${c.years} ans</b><small>d’expérience</small></div><div><b>${c.sessions}</b><small>séances réalisées</small></div><div><b>${price(c)} €</b><small>les 60 minutes</small></div></div><div class="note row">${ic('check')}<span>Tous niveaux bienvenus.<br>Première séance adaptée à votre objectif.</span></div><div class="schedule" id="profile-schedule"><div class="row between subhead"><h2>Votre prochain moment</h2><small class="muted">${days[pd].d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</small></div>${dateStrip(pd,'profile-day')}<p class="small muted" style="margin:16px 0 10px">${dayLabel(pd)} · 60 min · Heure de Paris</p><div class="slots">${slots.length?slots.map(t=>`<button class="slot" data-action="book" data-id="${c.id}" data-day="${pd}" data-time="${t}">${t}</button>`).join(''):'<p class="muted">Pas de créneau ce jour. Choisissez une autre date.</p>'}</div></div><div class="sep"></div><h2 class="subhead">Faire connaissance</h2><p>${esc(c.bio)}</p><h3 style="margin:22px 0 10px">Une séance avec ${c.name.split(' ')[0]}</h3><p class="muted">${esc(c.method)}</p><div class="sep"></div><h2 class="subhead">Où on se retrouve</h2><div class="row">${ic('pin')}<div><strong>${esc(c.place)}</strong><p class="small muted">${esc(c.address)}</p></div></div><p class="small muted" style="margin-top:14px">${c.formats.includes('Domicile')?'Se déplace à domicile dans un rayon de 3 km autour de son lieu de séance. Déplacement inclus. ':''}${c.formats.includes('Visio')?'Séances en visio également disponibles.':''}</p><div class="row wrap space">${c.formats.map(f=>`<span class="chip">${f}</span>`).join('')}</div><div class="sep"></div><h2 class="subhead">Entre de bonnes mains</h2><div class="stack"><div class="row">${ic('shield')}<div><strong>Identité et justificatifs vérifiés</strong><p class="small muted">${esc(c.cert)}</p></div></div><div class="row">${ic('message')}<span>${esc(c.langs)}</span></div></div><button class="textbtn space" data-action="trust">Comprendre la vérification</button><div class="sep"></div><div id="profile-reviews"><h2 class="subhead">★ ${c.rating} · ${c.reviews} avis</h2><div class="row between"><strong>${['Julie','Manon','Antoine','Élise','Hugo','Léa'][c.id]}</strong><small class="muted">Séance vérifiée · sept. 2026</small></div><p style="margin:12px 0">${['Une première séance sans appréhension. Thomas explique chaque mouvement et ajuste vraiment à mon niveau. Je repars motivée.','Sarah prend le temps de corriger les postures. Une heure précise et douce à la fois, je reviens la semaine prochaine.','Idriss a trouvé le rythme qui me convient. Pour la première fois, je me projette sur un 10 km.','Camille propose des variantes pour chaque posture. Je me suis sentie à l’aise dès le début.','Des explications claires, de la technique, et une progression que je comprends enfin.','Je n’avais jamais enfilé de gants. Inès met en confiance et la séance passe très vite.'][c.id]}</p><span class="small muted">Avis et vérifications simulés pour ce prototype.</span></div><div class="sep"></div><h3>Un imprévu ?</h3><p class="small muted" style="margin-top:8px">Annulation gratuite jusqu’à 24 h avant. Au-delà, la séance reste due. Modification gratuite jusqu’à 2 h avant, selon les disponibilités.</p><button class="textbtn space" data-action="report" data-id="${c.id}">Signaler ce profil</button></div><div class="sticky-cta"><div><strong style="font-size:22px">${price(c)} €</strong><p class="small muted">60 min · tout compris</p></div><button class="pill" data-action="profile-calendar">Voir les créneaux ${ic('arrow','sm')}</button></div>`}
function legacyLocationFor(b){let c=coaches[b.coach];if(b.format==='Visio')return {name:'En visioconférence',address:'Lien disponible dans le détail de votre séance'};if(b.format==='Domicile')return {name:'À votre domicile',address:b.home||'Adresse à préciser'};if(b.format===c.formats[0])return {name:c.place,address:c.address};if(b.format==='Parc')return {name:'Square Maurice-Gardette',address:'2 rue du Général-Blaise, 75011 Paris'};return {name:'Studio Voltaire',address:'22 rue de la Roquette, 75011 Paris'}}
function summaryPerson(b){let c=coaches[b.coach];return `<div class="summary-person"><div class="photo person-${c.id} p${c.photoIndex??c.id%6} avatar" role="img" aria-label="${esc(c.name)}"></div><div><h3>${esc(c.name)}</h3><p>${esc(c.sport)} · ★ ${c.rating}</p></div></div>`}
function legacyStartBooking(id,time,day){const c=coaches[id];state.booking={coach:id,day:day??state.day,time,kind:'Individuel',format:state.format!=='Tous'&&c.formats.includes(state.format)?state.format:c.formats[0],home:'',payment:'apple'};state.editId=null;go('setup')}
function legacyBookingPrice(b){return price(coaches[b.coach])+(b.kind==='Duo'?20:0)}
function legacySetup(){let b=state.booking,c=coaches[b.coach];return `${pagebar('Votre séance')}<div class="section"><div class="eyebrow muted">01 — LES DÉTAILS</div><h1 style="margin:12px 0 24px">Un moment pour vous.</h1>${summaryPerson(b)}<button class="setting-row" data-action="booking-date"><div class="row">${ic('calendar')}<div><strong>${dayLabel(b.day)}</strong><small>${b.time} – ${endTime(b.time,b.duration||60)} · 60 min</small></div></div>${ic('chevron')}</button><h2 class="space subhead">Comment on s’entraîne ?</h2>${['Individuel','Duo'].map(k=>`<button class="choice ${b.kind===k?'active':''}" data-action="kind" data-id="${k}"><span class="radio"></span><span class="grow"><strong>${k==='Individuel'?'Juste vous':'À deux'}</strong><small>${k==='Individuel'?'Une séance entièrement personnalisée':'Venez avec la personne de votre choix'}</small></span><strong>${price(c)+(k==='Duo'?20:0)} €</strong></button>`).join('')}<h2 class="space subhead">Où on se retrouve ?</h2>${c.formats.map(f=>`<button class="choice ${b.format===f?'active':''}" data-action="format" data-id="${f}"><span class="radio"></span><span class="grow"><strong>${f==='Domicile'?'Chez vous':f==='Visio'?'En visio':f==='Parc'?'En extérieur':'Au studio'}</strong><small>${f==='Domicile'?'Dans un rayon de 3 km · déplacement inclus':f==='Visio'?'Le lien sera accessible après réservation':locationFor({...b,format:f}).name}</small></span></button>`).join('')}${b.format==='Domicile'?`<label class="field space">Adresse de la séance<input id="home-address" placeholder="Ex. 10 rue de la Roquette, Paris 11e" value="${esc(b.home)}"><small class="muted">Adresse fictive uniquement. Zone de déplacement simulée.</small></label>`:''}<div class="note space">${ic('shield','sm')} Annulation gratuite jusqu’à 24 h avant la séance.</div></div><div class="sticky-cta"><div><strong style="font-size:22px">${bookingPrice(b)} €</strong><p class="small muted">Prix total${b.kind==='Duo'?' pour deux':''}</p></div><button class="pill" data-action="checkout">Continuer ${ic('arrow','sm')}</button></div>`}
function legacyEndTime(t){let m=mins(t)+60;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
function prior_checkout(){let b=state.booking,l=locationFor(b);return `${pagebar('Récapitulatif')}<div class="section"><div class="eyebrow muted">02 — CONFIRMATION & PAIEMENT</div><h1 style="margin:12px 0 24px">Vous y êtes presque.</h1>${summaryPerson(b)}<div class="ticket"><div class="row">${ic('calendar')}<div><strong>${dayLabel(b.day)}</strong><p class="small">${b.time} – ${endTime(b.time,b.duration||60)} · 60 min · ${b.kind}</p></div></div><div class="sep"></div><div class="row">${ic('pin')}<div><strong>${l.name}</strong><p class="small muted">${esc(l.address)}</p></div></div></div><div class="receipt"><div class="row between"><span>${esc(b.serviceName||b.kind)}</span><strong>${bookingPrice(b)-(b.coach===activeCoachId&&b.format==='Domicile'?cfg.travelFee:0)} €</strong></div>${b.coach===activeCoachId&&b.format==='Domicile'&&cfg.travelFee?`<div class="row between"><span>Déplacement à domicile</span><strong>${cfg.travelFee} €</strong></div>`:''}<div class="row between"><span>Frais de réservation</span><strong>0 €</strong></div><div class="row between total"><strong>Total à payer</strong><strong>${bookingPrice(b)} €</strong></div></div><h2 class="subhead">Votre moyen de paiement</h2>${[['apple','Apple Pay','Simulation en un geste'],['card','Carte bancaire','Carte de démonstration · •••• 4242']].map(([v,t,s])=>`<button class="choice ${b.payment===v?'active':''}" data-action="payment" data-id="${v}"><span class="radio"></span><span class="grow"><strong>${t}</strong><small>${s}</small></span>${ic('wallet')}</button>`).join('')}<div class="note space"><strong>Un changement de programme ?</strong><p style="margin-top:6px">${hoursUntil(b)<(b.cancelHours??24)?'Ce créneau commence dans moins de 24 h : une annulation ne donnera pas lieu à un remboursement.':'Annulez gratuitement jusqu’au '+cancellationDeadline(b)+'.'} Modification possible jusqu’à 2 h avant.</p></div><p class="small muted space">Mode démonstration : aucun débit, aucune donnée bancaire demandée. La réservation est enregistrée uniquement dans ce navigateur.</p></div><div class="sticky-cta"><button class="pill full" data-action="pay">${ic('shield','sm')} Réserver · ${bookingPrice(b)} €</button></div>`}
function hoursUntil(b){return (instantFor(b.day,b.time)-appNow().getTime())/3600000}
function legacyCancellationDeadline(b){let d=new Date(base);d.setDate(d.getDate()+b.day-1);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+' à '+b.time}
function findBooking(){return state.bookings.find(b=>b.id===state.selectedBooking)||pastBooking}
const pastBooking={id:'past-sarah',coach:1,day:-3,time:'18:00',kind:'Individuel',format:'Studio',price:45,status:'completed'};

const sectors=[...Array.from({length:20},(_,i)=>({nom:'Paris '+(i+1)+(i===0?'er':'e'),code:String(75101+i),codeDepartement:'75',codesPostaux:[String(75001+i)]})),...idfCommunes];
function sectorLabel(c){return c.codeDepartement==='75'?c.nom:c.nom+' · '+c.codeDepartement}
function folded(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’'\-]/g,' ').replace(/\s+/g,' ').trim()}
function sectorMatches(query='',department=''){let words=folded(query).split(' ').filter(Boolean);return sectors.filter(c=>(!department||c.codeDepartement===department)&&words.every(w=>folded([c.nom,c.codeDepartement,idfDepartments[c.codeDepartement],...c.codesPostaux].join(' ')).includes(w))).sort((a,b)=>{if(!words.length)return 0;let q=folded(query),rank=c=>folded(c.nom)===q||c.codesPostaux.includes(q)?0:folded(c.nom).startsWith(q)?1:words.every(w=>folded(c.nom).includes(w))?2:3;return rank(a)-rank(b)||a.nom.localeCompare(b.nom,'fr')})}
function sectorRows(){let found=sectorMatches(state.sectorQuery,state.sectorDepartment),limit=state.sectorLimit||15;return `<p class="small muted" role="status" style="margin:12px 0">${found.length} secteur${found.length===1?'':'s'}${found.length>limit?' · '+limit+' affichés':''}</p>${found.slice(0,limit).map(c=>`<button type="button" class="setting-row" data-action="choose-sector" data-id="${c.code}"><span style="min-width:0"><strong>${esc(c.nom)}</strong><small class="muted" style="display:block">${esc(idfDepartments[c.codeDepartement])} · ${c.codesPostaux[0]||c.codeDepartement}</small></span>${ic('chevron','sm')}</button>`).join('')||'<p class="note">Aucun secteur trouvé. Essayez le nom de la commune ou son code postal.</p>'}${found.length>limit?'<button type="button" class="pill light full space" data-action="more-sectors">Afficher plus de communes</button>':''}`}
function openSectors(){state.sectorQuery='';state.sectorDepartment='';state.sectorLimit=15;showModal('Votre secteur en Île-de-France',`<p class="small muted subhead">${esc(state.screen==='onboarding'?customer.city:state.city)} · secteur actuel</p><label class="field">Commune ou code postal<input type="search" id="sector-search" placeholder="Versailles, Saint-Denis, 94000…" autocomplete="off"></label>${selectField('Département','sector-department',[['','Toute l’Île-de-France'],...Object.entries(idfDepartments).map(([code,name])=>[code,code+' · '+name])],'')}<div id="sector-results">${sectorRows()}</div><p class="small muted space">Les 8 départements, les communes et les 20 arrondissements de Paris. L’offre de coachs reste fictive et parisienne ; la visio est disponible ailleurs.</p>`)}
function chooseSector(code){let c=sectors.find(c=>c.code===code);if(!c)return;customer.city=sectorLabel(c);customer.cityCode=c.code;state.city=customer.city;persist();closeModal();if(state.screen==='onboarding')render();else go('explore')}
function updateSectors(){state.sectorQuery=document.getElementById('sector-search').value;state.sectorDepartment=document.querySelector('[name="sector-department"]').value;state.sectorLimit=15;document.getElementById('sector-results').innerHTML=sectorRows()}

function prior_allSlots(c,d){if(c.id!==activeCoachId||!cfg.weeklyConfigured)return legacyAllSlots(c,d);if(!cfg.week[d%7]||cfg.daysOff.includes(d))return [];let result=[],dur=selectedService(activeCoachId).duration;for(let t=mins(cfg.start);t+dur<=mins(cfg.end);t+=30){if(!cfg.useBreak||t+dur<=mins(cfg.breakStart)||t>=mins(cfg.breakEnd))result.push(clockText(t))}return result}

function soloAvail(c,d,ignoreId,admin=false){let s=selectedService(c.id);if(c.id===activeCoachId&&((!admin&&(!cfg.published||!cfg.verified||!cfg.payoutReady))||!servicesFor(activeCoachId).length||!cfg.formats.length||d>=todayIndex()+cfg.horizon||cfg.daysOff.includes(d)))return [];let buffer=c.id===activeCoachId?cfg.buffer:0;return allSlots(c,d).filter(t=>!state.closed.includes(key(c.id,d,t))&&(c.id!==activeCoachId||hoursUntil({day:d,time:t})>=cfg.notice)&&!state.bookings.some(b=>b.id!==ignoreId&&['confirmed','completed','no-show'].includes(b.status)&&b.coach===c.id&&b.day===d&&overlaps(mins(t),s.duration,mins(b.time),b.duration||60,buffer))&&!(c.id===activeCoachId&&cfg.privateEvents.some(e=>e.day===d&&overlaps(mins(t),s.duration,mins(e.start),mins(e.end)-mins(e.start),buffer))))}

function prior_configPage(){let id=state.configSection,entry=coachSections.find(x=>x[0]===id),body='';if(id==='profile')body=`${inputField('Nom public','name',cfg.name,'text','required maxlength="60"')}${selectField('Discipline principale','sport',Object.keys(sportGoals).filter(s=>s!=='Tout'),cfg.sport)}<label class="field">Votre approche<textarea name="bio" required maxlength="900">${esc(cfg.bio)}</textarea></label>${inputField('Années d’expérience','experience',cfg.experience,'number','min="0" max="60" required')}${inputField('Diplômes et certifications','cert',cfg.cert,'text','required maxlength="160"')}${inputField('Langues parlées','langs',cfg.langs,'text','required maxlength="100"')}<p class="note">Portrait de démonstration conservé. La vérification des pièces est indépendante du texte de votre profil.</p>`;

if(id==='payout')body=`${inputField('Nom professionnel de démonstration','businessName',cfg.business.name,'text','required maxlength="100"')}${selectField('Statut professionnel','businessStatus',['Entreprise individuelle','Microentreprise','Société','Association'],cfg.business.status)}${inputField('E-mail de contact fictif','businessEmail',cfg.business.email,'email','required')}${inputField('Adresse professionnelle fictive','businessAddress',cfg.business.address,'text','required maxlength="180"')}<div class="note"><strong>${cfg.payoutReady?'Versements activés · compte de test':'Activez les versements pour publier'}</strong><p>Le prestataire de paiement prendrait en charge la vérification professionnelle et les coordonnées bancaires.</p></div><div class="receipt"><div class="row between"><span>Commission par réservation</span><strong>15 %</strong></div><div class="row between"><span>Abonnement</span><strong>0 €</strong></div><div class="row between"><span>Versement</span><strong>Après la séance</strong></div></div><button type="button" class="pill full" data-action="simulate-payout">${cfg.payoutReady?'Voir le compte de test':'Activer un compte de test'}</button><p class="small muted space">Aucune donnée bancaire ni immatriculation réelle à saisir. Le relevé d’activité est accessible dans l’onglet Activité.</p>`;

function sessionMarkup(html,b){if(!b)return html;let h=b.cancelHours??(b.coach===activeCoachId?cfg.cancelHours:24);return html.replaceAll('60 min',(b.duration||60)+' min').replaceAll('24 h',h+' h').replaceAll('24 heures',h+' heures')}

function prior_configSave(form){let f=new FormData(form),id=form.dataset.section,error=document.getElementById('config-error'),v=k=>f.get(k),n=k=>Number(v(k));let problem='';if(id==='profile'){if(!v('name').trim()||!v('bio').trim()||!v('cert').trim())problem='Complétez le nom, la présentation et les qualifications.';else{let changed=cfg.cert!==v('cert')||cfg.name!==v('name');Object.assign(cfg,{name:v('name').trim(),sport:v('sport'),bio:v('bio').trim(),cert:v('cert').trim(),langs:v('langs').trim(),experience:n('experience')});if(changed){cfg.verified=false;cfg.published=false}cfg.checks.profile=true}}
if(id==='offers')cfg.checks.offers=cfg.services.some(s=>s.active);
if(id==='places'){let formats=f.getAll('formats');if(!formats.length)problem='Choisissez au moins un format de séance.';else if(formats.includes('Parc')&&(!v('place').trim()||!v('address').trim()))problem='Précisez le lieu et l’adresse du rendez-vous en extérieur.';else if(formats.includes('Studio')&&(!v('studio').trim()||!v('studioAddress').trim()))problem='Précisez le nom et l’adresse du studio.';else{Object.assign(cfg,{formats,place:v('place').trim(),address:v('address').trim(),studio:v('studio').trim(),studioAddress:v('studioAddress').trim(),radius:n('radius'),travelFee:n('travelFee')});cfg.checks.places=true}}
if(id==='schedule'){if(mins(v('start'))>=mins(v('end')))problem='La fin de journée doit être après le début.';else if(f.has('useBreak')&&(mins(v('breakStart'))>=mins(v('breakEnd'))||mins(v('breakStart'))<mins(v('start'))||mins(v('breakEnd'))>mins(v('end'))))problem='La pause doit se situer à l’intérieur de la journée, avec une fin après son début.';else if(!f.getAll('week').length)problem='Ouvrez au moins un jour dans votre semaine type.';else if(cfg.services.some(s=>s.active)&&!cfg.services.some(s=>s.active&&scheduleFits(s.duration,v('start'),v('end'),f.has('useBreak'),v('breakStart'),v('breakEnd'))))problem='Ces horaires ne permettent aucune de vos séances. Élargissez la journée ou réduisez la pause.';else{Object.assign(cfg,{weeklyConfigured:true,week:Array.from({length:7},(_,i)=>f.getAll('week').includes(String(i))),start:v('start'),end:v('end'),useBreak:f.has('useBreak'),breakStart:v('breakStart'),breakEnd:v('breakEnd'),daysOff:f.getAll('daysOff').map(Number)});cfg.checks.schedule=true}}
if(id==='rules')Object.assign(cfg,{buffer:n('buffer'),notice:n('notice'),horizon:n('horizon'),cancelHours:n('cancelHours')});
if(id==='payout')cfg.business={name:v('businessName').trim(),status:v('businessStatus'),email:v('businessEmail').trim(),address:v('businessAddress').trim()};
if(id==='notifications')for(let k of Object.keys(cfg.notifications))cfg.notifications[k]=f.has(k);
if(problem){error.textContent=problem;error.scrollIntoView({block:'nearest'});return}state.configDirty=false;syncCoach();persist();if(state.wizard)go('coach-wizard');else render();toast('Réglages enregistrés. Les réservations déjà payées sont conservées.');}

function prior_individualAlertCandidates(a){if(a.status!=='active')return [];return coaches.flatMap(c=>{if(a.coach!==null&&c.id!==a.coach)return [];if(a.coach===null&&(!a.city.startsWith('Paris')&&a.format!=='Visio'||a.sport!=='Tout'&&![c.sport,...c.tags].includes(a.sport)||a.format!=='Visio'&&c.dist>a.distance))return [];if(a.format!=='Tous'&&!c.formats.includes(a.format))return [];let price=primaryService(c.id).price+(c.id===activeCoachId&&a.format==='Domicile'?cfg.travelFee:0);if(price>a.budget)return [];return avail(c,a.day).filter(t=>mins(t)>=mins(a.from)&&mins(t)<=mins(a.to)).map(time=>({coach:c.id,time,day:a.day,price}))})}

function newAlert(coach=null){state.alertCoach=coach;let existing=state.screen==='profile',d=existing?(state.profileDay??state.day):state.day;showModal('Votre prochain créneau',`<p class="muted subhead">${coach===null?'Gardez cette recherche.':'Suivez les disponibilités de '+esc(coaches[coach].name)+'.'} Aucune réservation automatique.</p><form id="alert-form">${selectField('Le jour qui vous convient','day',futureDays(),d)}<div class="split">${inputField('Début au plus tôt','from',state.hour||(state.period==='evening'?'18:00':'07:00'),'time','required step="1800"')}${inputField('Début au plus tard','to',state.hour||'22:00','time','required step="1800"')}</div><div class="note">${coach===null?esc(state.sport)+' · '+esc(state.city)+'<br>Jusqu’à '+state.maxPrice+' € · '+esc(state.format)+(state.format==='Visio'?'':' · '+state.maxDist+' km'):'Séances individuelles, duo et cours en groupe de ce coach · prix d’entrée.'}</div><p id="alert-error" role="alert" class="small space"></p><button class="pill full space">Enregistrer mon alerte</button><p class="small muted space">Démo : les correspondances sont recalculées à l’ouverture de vos alertes. Aucun e-mail ni notification externe. L’alerte concerne uniquement le jour choisi.</p></form>`)}
function prior_alertsPage(){return `${pagebar('Mes alertes')}<div class="section"><div class="eyebrow muted">LE BON MOMENT FINIT PAR ARRIVER.</div><h1 class="space">On garde<br>une place à vos envies.</h1><p class="muted space">Retrouvez les créneaux compatibles, puis choisissez librement de réserver.</p>${operations.alerts.length?operations.alerts.map(a=>{let matches=alertCandidates(a);return `<article class="booking-row"><div class="row between"><strong>${esc(alertDescription(a))}</strong><span class="badge">${a.status==='booked'?'Réservée':a.status==='paused'?'En pause':matches.length?matches.length+' créneau'+(matches.length>1?'x':''):'En attente'}</span></div><p class="small muted space">${dayLabel(a.day)} · ${a.from===a.to?'à '+a.from:'début entre '+a.from+' et '+a.to}<br>Jusqu’à ${a.budget} € · ${esc(a.format)}</p>${matches.slice(0,state.alertExpanded===a.id?matches.length:3).map(m=>`<button class="setting-row" data-action="alert-book" data-id="${a.id}" data-coach="${m.coach}" data-time="${m.time}"><span><strong>${esc(coaches[m.coach].name)} · ${m.time}</strong><small style="display:block">${m.price} €${m.groupId?'/pers. · Groupe':''} · ${m.duration||primaryService(m.coach).duration} min</small></span>${ic('chevron')}</button>`).join('')}${matches.length>3&&state.alertExpanded!==a.id?`<button class="textbtn full space" data-action="expand-alert" data-id="${a.id}">Voir les ${matches.length} créneaux</button>`:''}${a.status==='active'&&!matches.length?'<p class="small space">Aucun créneau compatible pour le moment.</p>':''}${a.status==='booked'?'<p class="small space">Une séance a été réservée depuis cette alerte.</p>':`<button class="textbtn space" data-action="toggle-alert" data-id="${a.id}">${a.status==='paused'?'Réactiver':'Mettre en pause'}</button>`}<button class="textbtn space" style="margin-left:20px" data-action="delete-alert" data-id="${a.id}">Supprimer</button></article>`}).join(''):'<div class="note space">Votre liste est vide. Enregistrez une recherche ou suivez un coach depuis son profil.</div>'}<button class="pill full space" data-action="nav" data-id="explore">Explorer les coachs</button><p class="small muted space">Actualisation à chaque visite dans cette démo. Le créneau reste ouvert aux autres clients jusqu’à confirmation.</p></div>`}
function issueForm(id){let b=state.bookings.find(x=>x.id===id)||(id===pastBooking.id?pastBooking:null);if(!b)return;state.issueBooking=id;let active=operations.tickets.find(t=>t.booking===id&&t.status==='open');if(active){state.ticketId=active.id;go('support');return}showModal('Un imprévu avec votre séance ?',`<p class="muted">${coaches[b.coach].name} · ${dayLabel(b.day)} · ${b.time}</p><form id="issue-form" class="space">${selectField('Que se passe-t-il ?','reason',['Le coach est absent','Météo ou lieu indisponible','Difficulté pour se retrouver','Problème de paiement ou remboursement','Séance contestée','Autre imprévu'],'Le coach est absent')}<label class="field">Expliquez-nous en quelques mots<textarea name="message" required maxlength="1200" placeholder="Décrivez uniquement une situation fictive."></textarea></label><p class="note">Une demande d’assistance ne modifie ni la séance ni son paiement. Vous pourrez suivre la réponse ici. Aucun délai de réponse réel n’est promis dans la démo.</p><button class="pill full space">Créer ma demande de démonstration</button></form>`)}
function ticketCard(t,admin=false){let b=state.bookings.find(x=>x.id===t.booking)||pastBooking;return `<article class="booking-row"><div class="row between"><span class="badge">${t.status==='open'?'À traiter':'Résolue'}</span><span class="small muted">${esc(t.id.slice(-6).toUpperCase())}</span></div><h3 class="space">${esc(t.reason)}</h3><p class="small muted">${esc(coaches[b.coach].name)} · ${dayLabel(b.day)} · ${b.time}</p><p class="space">${esc(t.message)}</p>${t.resolution?`<div class="note space"><strong>Réponse de l’équipe Partant</strong><p>${esc(t.resolution)}</p><p class="space">${t.refund?'Remboursement simulé : '+t.refund+' €':'Aucun remboursement supplémentaire.'}</p></div>`:'<p class="small muted space">Demande enregistrée localement. Aucune assistance réelle contactée.</p>'}${admin&&t.status==='open'?`<button class="pill full space" data-action="resolve-ticket" data-id="${t.id}">Examiner la demande</button>`:''}${admin?`<details class="space"><summary class="small">Historique des actions</summary>${t.audit.map(x=>`<p class="small muted">${esc(x)}</p>`).join('')}</details>`:''}</article>`}
function prior_supportPage(){return `${pagebar('Mes demandes')}<div class="section"><h1>On suit<br>votre demande.</h1><p class="muted space">Les réponses et décisions restent accessibles ici.</p>${operations.tickets.length?operations.tickets.map(t=>ticketCard(t)).join(''):'<div class="note space">Aucune demande. Ouvrez le détail d’une séance pour signaler un imprévu.</div>'}<button class="pill light full space" data-action="nav" data-id="bookings">Retrouver mes séances</button></div>`}
function prior_operationsPage(){return `${pagebar('Équipe Partant · démo')}<div class="section"><div class="eyebrow muted">LES COULISSES DE LA RENCONTRE</div><h1 class="space">Chaque demande<br>a une suite.</h1><p class="note space">Espace de démonstration accessible pour tester le parcours. En production, cet accès serait réservé à l’équipe habilitée.</p><div class="stats"><div><b>${operations.tickets.filter(t=>t.status==='open').length}</b><small>à traiter</small></div><div><b>${operations.tickets.filter(t=>t.status==='resolved').length}</b><small>résolues</small></div><div><b>${operations.alerts.filter(a=>a.status==='active').length}</b><small>alertes actives</small></div></div><h2>Demandes d’assistance</h2>${operations.tickets.length?operations.tickets.map(t=>ticketCard(t,true)).join(''):'<p class="muted space">Aucun dossier pour le moment. Créez une demande depuis une séance client pour tester son traitement.</p>'}<button class="pill light full space" data-action="nav" data-id="account">Revenir côté client</button><p class="small muted space">Ce premier espace couvre l’assistance et les remboursements simulés. Modération, contrôle documentaire et rapprochement des versements restent dans la feuille de route.</p></div>`}
function resolveTicket(id){let t=operations.tickets.find(t=>t.id===id);if(!t||t.status!=='open')return;let b=state.bookings.find(b=>b.id===t.booking)||(t.booking===pastBooking.id?pastBooking:null);if(!b)return;state.ticketId=id;let remaining=Math.max(0,b.price-(b.refund||0));showModal('Examiner avant de décider',`<h3>${esc(t.reason)}</h3><p class="space">${esc(t.message)}</p><div class="receipt"><div class="row between"><span>Montant réglé</span><strong>${b.price} €</strong></div><div class="row between"><span>Déjà remboursé</span><strong>${b.refund||0} €</strong></div><div class="row between"><span>Reste remboursable</span><strong>${remaining} €</strong></div></div><form id="resolution-form">${selectField('Décision de démonstration','decision',[['reply','Répondre sans remboursement'],...(remaining?[['refund','Rembourser le solde · '+remaining+' €']]:[])],'reply')}<label class="field">Réponse visible du client<textarea name="reply" required maxlength="1200" placeholder="Expliquez la décision et la prochaine étape."></textarea></label><p class="note">Un remboursement clôture cette réservation. Ses places sont libérées ; un éventuel cours collectif reste programmé. Aucun virement réel.</p><button class="pill full space">Enregistrer la décision simulée</button></form>`)}
function priorityRender(){let special={alerts:alertsPage,support:supportPage,operations:operationsPage,'preparation-settings':preparationSettings};if(special[state.screen]){view.innerHTML='<div class="screen">'+special[state.screen]()+'</div>';nav();if(state.auth?.role==='coach')document.getElementById('nav').innerHTML=coachNavigation();document.getElementById('nav').classList.toggle('hidden',['operations','preparation-settings'].includes(state.screen));return}v2Render();let html=view.innerHTML;if(state.screen==='explore')html=html.replace('<div class="app-footer">','<div class="section"><button class="pill light full" data-action="new-alert">Garder cette recherche en alerte</button><button class="textbtn full space" data-action="open-alerts">Mes alertes · '+operations.alerts.filter(a=>a.status==='active').length+'</button></div><div class="app-footer">');if(state.screen==='profile')html=html.replace('<div class="sticky-cta">','<div class="section"><button class="pill light full" data-action="coach-alert" data-id="'+state.coach+'">Suivre les créneaux de ce coach</button></div><div class="sticky-cta">');if(state.screen==='account')html=html.replace('<button class="setting-row" data-action="customer-settings">','<button class="setting-row" data-action="open-alerts"><span>Mes alertes de disponibilité</span>'+ic('chevron')+'</button><button class="setting-row" data-action="open-support"><span>Mes demandes d’assistance</span>'+ic('chevron')+'</button><button class="setting-row" data-action="customer-settings">').replace('<button class="textbtn full" data-action="complete-demo">','<button class="textbtn full" data-action="open-operations">Tester l’espace équipe Partant</button><button class="textbtn full" data-action="complete-demo">');if(state.screen==='detail'){let b=findBooking();html=html.replace(/<p>Une tenue confortable,[^<]*<\/p>/,'<p>'+esc(b.format==='Visio'?'Prévoyez un espace dégagé et votre appareil chargé.':preparationFor(b).bring)+'</p>');html=html.replace('<h2 class="subhead">Avant de venir</h2>','<button class="pill light full" data-action="preparation" data-id="'+b.id+'">Préparer ma séance '+ic('check','sm')+'</button><h2 class="subhead space">Avant de venir</h2>');html=html.replace('<div class="note space"><strong>Et si on gardait le rythme ?',`<button class="setting-row" data-action="new-issue" data-id="${b.id}"><span>Un imprévu ? Demander de l’aide</span>${ic('chevron')}</button><button class="textbtn full space" data-action="open-support">Suivre mes demandes</button><div class="note space"><strong>Et si on gardait le rythme ?`)}if(state.screen==='coach'&&state.coachTab==='settings')html+='<div class="section"><button class="setting-row" data-action="preparation-settings"><span>Consignes avant la séance</span>'+ic('chevron')+'</button></div>';view.innerHTML=html}
function priorityAct(a,d={}){switch(a){case 'expand-alert':state.alertExpanded=d.id;render();return;case 'new-alert':newAlert();return;case 'coach-alert':newAlert(+d.id);return;case 'open-alerts':closeModal();go('alerts');return;case 'toggle-alert':{let x=operations.alerts.find(x=>x.id===d.id);if(x&&x.status!=='booked'){x.status=x.status==='active'?'paused':'active';persist();render()}return}case 'delete-alert':showModal('Supprimer cette alerte ?',`<p>Votre recherche enregistrée sera retirée. Vos séances déjà réservées sont conservées.</p><button class="pill full space" data-action="confirm-delete-alert" data-id="${d.id}">Supprimer l’alerte</button>`);return;case 'confirm-delete-alert':operations.alerts=operations.alerts.filter(x=>x.id!==d.id);persist();closeModal();render();return;case 'alert-book':{let x=operations.alerts.find(x=>x.id===d.id),m=x&&alertCandidates(x).find(m=>m.coach===+d.coach&&m.time===d.time);if(!m){toast('Ce créneau n’est plus disponible.');render();return}if(m.groupId){state.groupId=m.groupId;state.groupAlert=x.id;go('group-details');return}state.format=x.format;startBooking(m.coach,m.time,m.day);state.booking.sourceAlert=x.id;return}case 'preparation':{let b=state.bookings.find(b=>b.id===d.id)||(d.id===pastBooking.id?pastBooking:null);if(b)showModal('Pour votre séance',preparationPanel(b));return}case 'preparation-settings':go('preparation-settings');return;case 'new-issue':issueForm(d.id);return;case 'open-support':closeModal();go('support');return;case 'open-operations':closeModal();go('operations');return;case 'resolve-ticket':resolveTicket(d.id);return;case 'confirm-reset':operations.alerts=[];operations.tickets=[];operations.checks={};operations.past=null;Object.assign(pastBooking,{status:'completed'});delete pastBooking.refund;delete pastBooking.cancelledBy;delete pastBooking.cancelReason;cfg.preparation={...preparationDefaults};break}v2Act(a,d)}
function priorityDoPay(){let b=state.booking;b.preparation={...preparationFor(b)};let before=state.bookings.length;v2DoPay();if(state.bookings.length>before&&b.sourceAlert){let a=operations.alerts.find(a=>a.id===b.sourceAlert);if(a){a.status='booked';persist()}}}
document.addEventListener('input',e=>{if(e.target.closest?.('#preparation-form'))state.configDirty=true});
document.addEventListener('change',e=>{let d=e.target.dataset;if(d?.prepCheck){(operations.checks[d.booking]??={})[d.prepCheck]=e.target.checked;persist()}});
document.addEventListener('submit',e=>{let form=e.target;if(!['alert-form','preparation-form','issue-form','resolution-form'].includes(form.id))return;e.preventDefault();let f=new FormData(form);if(form.id==='alert-form'){let from=f.get('from'),to=f.get('to');if(!from||!to||mins(from)>mins(to)){document.getElementById('alert-error').textContent='L’heure de fin doit être après l’heure de début, ou identique pour un horaire précis.';return}let a={coach:state.alertCoach,day:+f.get('day'),from,to,city:state.city,sport:state.alertCoach===null?state.sport:'Tout',budget:state.alertCoach===null?state.maxPrice:300,distance:state.maxDist,format:state.alertCoach===null?state.format:'Tous'};let signature=JSON.stringify(a),duplicate=operations.alerts.find(x=>x.customerId===currentCustomerId&&x.signature===signature&&x.status!=='booked');if(duplicate)duplicate.status='active';else operations.alerts.unshift({...a,customerId:currentCustomerId,id:'a-'+Date.now().toString(36),status:'active',signature});persist();closeModal();go('alerts')}
if(form.id==='preparation-form'){state.configDirty=false;cfg.preparation=Object.fromEntries(['provided','bring','meeting','weather'].map(k=>[k,String(f.get(k)||'').trim()]));persist();state.coachTab='settings';go('coach');toast('Consignes enregistrées pour les prochaines réservations')}
if(form.id==='issue-form'){let message=String(f.get('message')||'').trim();if(!message)return;let b=state.bookings.find(b=>b.id===state.issueBooking)||(state.issueBooking===pastBooking.id?pastBooking:null);if(!b)return;if(!operations.tickets.some(t=>t.booking===b.id&&t.status==='open'))operations.tickets.unshift({customerId:currentCustomerId,id:'d-'+Date.now().toString(36),booking:b.id,reason:f.get('reason'),message,status:'open',refund:0,audit:['Demande créée par le client dans la démo.']});persist();closeModal();go('support')}
if(form.id==='resolution-form'){let t=operations.tickets.find(t=>t.id===state.ticketId),reply=String(f.get('reply')||'').trim();if(!t||t.status!=='open'||!reply)return;let b=state.bookings.find(b=>b.id===t.booking)||(t.booking===pastBooking.id?pastBooking:null);if(!b)return;let refund=f.get('decision')==='refund'?Math.max(0,b.price-(b.refund||0)):0;if(refund){b.refund=b.price;b.status='cancelled';b.cancelledBy='partant';b.cancelReason='Décision de l’assistance';if(b===pastBooking)operations.past={...b};}Object.assign(t,{status:'resolved',resolution:reply,refund});t.audit.push(refund?'Équipe Partant : remboursement simulé de '+refund+' € et clôture.':'Équipe Partant : réponse sans remboursement et clôture.');persist();closeModal();go('operations')}
});

// Group offerings are scheduled classes, with their own fixed venue and seat inventory.
operations.groups=operationsSaved.groups||[];
function groupById(id){return operations.groups.find(g=>g.id===id)}
function groupReservations(g){return state.bookings.filter(b=>b.groupSessionId===g.id&&b.status!=='cancelled')}
function groupSeats(g){return Math.max(0,g.capacity-groupReservations(g).reduce((n,b)=>n+(b.participants||1),0))}
function prior_groupPublic(g){let s=cfg.services.find(s=>s.id===g.serviceId);return g.status==='open'&&cfg.published&&cfg.verified&&cfg.payoutReady&&s?.active&&s.kind==='Groupe'&&g.day<todayIndex()+cfg.horizon&&!cfg.daysOff.includes(g.day)&&hoursUntil(g)>=cfg.notice}
function prior_groupMatches(g){return groupPublic(g)&&(state.city.startsWith('Paris')||g.format==='Visio')&&(state.sport==='Tout'||[coaches[activeCoachId].sport,...coaches[activeCoachId].tags].includes(state.sport))&&(state.format==='Tous'||state.format===g.format)&&(g.format==='Visio'||coaches[activeCoachId].dist<=state.maxDist)&&g.unitPrice<=state.maxPrice&&g.day===state.day&&(!state.hour||g.time===state.hour)&&(state.period!=='evening'||mins(g.time)>=18*60)&&folded([g.name,cfg.name,cfg.sport,coaches[activeCoachId].area].join(' ')).includes(folded(state.query))}
function prior_avail(c,d,ignoreId,admin=false){if(selectedService(c.id).kind==='Groupe')return [];return soloAvail(c,d,ignoreId,admin).filter(t=>c.id!==activeCoachId||!operations.groups.some(g=>g.coach===activeCoachId&&g.status==='open'&&g.day===d&&overlaps(mins(t),selectedService(c.id).duration,mins(g.time),g.duration,cfg.buffer)))}
function bookingPrice(b){return b.groupSessionId?b.unitPrice*b.participants:soloBookingPrice(b)}
function prior_groupCard(g,admin=false){let left=groupSeats(g),count=g.capacity-left;return `<article class="booking-row"><div class="row between"><span class="badge">${admin&&g.status==='cancelled'?'Annulé':left?left+' place'+(left>1?'s':'')+' restante'+(left>1?'s':''):'Complet'}</span><strong>${g.unitPrice} € <small class="muted">/ pers.</small></strong></div><h3 class="space">${esc(g.name)}</h3><p class="small muted">${esc(cfg.name)} · ${esc(g.level)}<br>${dayLabel(g.day)} · ${g.time} – ${endTime(g.time,g.duration)}<br>${esc(g.location.name)} · ${g.capacity} participants maximum</p><button class="pill ${admin?'light':''} full space" data-action="${admin?'manage-group':'group-details'}" data-id="${g.id}">${admin?'Gérer · '+count+'/'+g.capacity+' inscrits':'Voir le cours'}</button></article>`}
function prior_groupDetails(){let g=groupById(state.groupId);if(!g)return pagebar('Cours introuvable');let left=groupSeats(g);return `${pagebar('Un moment à plusieurs')}<div class="section"><div class="photo person-${activeCoachId} p${coaches[activeCoachId].photoIndex??activeCoachId%6}" style="height:190px;border-radius:18px" role="img" aria-label="Portrait de ${esc(cfg.name)}"></div><span class="badge space" style="display:inline-block">${left?left+' places disponibles':'Cours complet'}</span><h1 class="space">${esc(g.name)}</h1><p class="muted space">Avec ${esc(cfg.name)} · ${esc(cfg.sport)}</p><div class="ticket"><strong>${dayLabel(g.day)} · ${g.time}</strong><p>${g.duration} min · ${esc(g.level)}<br>${g.capacity} participants maximum</p></div><h2>Le lieu du groupe</h2><p class="space">${esc(g.location.name)}<br><span class="muted">${esc(g.location.address)}</span></p><p class="note space">${g.unitPrice} € par personne, frais inclus. Le cours est maintenu dès la première inscription. Chaque réservation suit ses propres conditions d’annulation.</p><p class="small muted space">Annulation gratuite jusqu’à ${g.cancelHours} h avant. En cas d’annulation du cours par le coach, toutes les réservations sont intégralement remboursées dans la démo.</p><button class="pill full space" data-action="join-group" data-id="${g.id}" ${!groupPublic(g)||!left?'disabled':''}>${!groupPublic(g)?'Inscriptions fermées':left?'Choisir mes places':'Cours complet'}</button>${groupPublic(g)&&!left?`<button class="pill light full space" data-action="group-alert" data-id="${g.id}">Me prévenir si une place se libère</button>`:''}</div>`}

function bookingEventSnapshot(b){return {day:b.day,time:b.time,status:b.status,participants:b.participants||1,refund:b.refund||0,coach:b.coach,customerId:b.customerId,groupSessionId:b.groupSessionId||null,serviceName:b.serviceName,price:b.price}}
function captureBookingEvents(){
 if(!identity?.eventSnapshots)return;
 for(let b of state.bookings){
  let previous=identity.eventSnapshots[b.id],next=bookingEventSnapshot(b),kind='';
  if(!previous&&b.status==='confirmed')kind='booked';
  else if(previous){
   if(previous.status!==b.status&&b.status==='cancelled')kind='cancelled';
   else if(previous.groupSessionId!==(b.groupSessionId||null))kind='transferred';
   else if(previous.day!==b.day||previous.time!==b.time)kind='rescheduled';
   else if(previous.participants!==next.participants)kind='participants';
   else if(previous.refund!==next.refund)kind='refunded';
  }
  identity.eventSnapshots[b.id]=next;
  if(!kind)continue;
  let recipients=['coach-'+b.coach,identity.accounts.find(a=>a.customerId===b.customerId)?.id].filter(id=>id&&id!==actorId());
  for(let recipient of recipients)identity.events.push({id:'event-'+(++identity.eventSequence),bookingId:b.id,recipient,kind,category:kind==='booked'?'booking':'changes',before:previous||null,after:next,clientName:identity.customers[b.customerId]?.name||b.clientName||'Client',coachName:coaches[b.coach].name,serviceName:b.serviceName||b.kind,at:Date.now(),read:false});
 }
}
function myNotifications(){return (identity.events||[]).filter(n=>n.recipient===actorId()).slice().reverse()}
function notificationEnabled(n){return state.auth?.role!=='coach'||ownerConfig(state.auth.coachId).notifications[n.category]!==false}
function unreadNotifications(){return myNotifications().filter(n=>!n.read&&notificationEnabled(n))}
function notificationTitle(n){return {booked:'Nouvelle réservation',rescheduled:'Séance déplacée',transferred:'Cours transféré',cancelled:'Séance annulée',refunded:'Remboursement actualisé',participants:'Participants modifiés'}[n.kind]}
function notificationDescription(n){let who=state.auth?.role==='coach'?n.clientName:n.coachName,after=dayLabel(n.after.day)+' à '+n.after.time;return esc(who)+' · '+esc(n.serviceName)+'<br>'+(['rescheduled','transferred'].includes(n.kind)?'<span class="muted">Avant : '+dayLabel(n.before.day)+' à '+n.before.time+'</span><br><strong>Maintenant : '+after+'</strong>':after)+(n.kind==='participants'?'<br><strong>'+n.before.participants+' → '+n.after.participants+' places</strong>':n.after.participants>1?'<br>'+n.after.participants+' places':'')+(['cancelled','refunded','participants','transferred'].includes(n.kind)?'<br>Remboursements cumulés : '+n.after.refund+' €':'')+(n.kind==='transferred'&&n.after.price>n.before.price?'<br>Supplément simulé : '+(n.after.price-n.before.price)+' €':'')}
function notificationsPage(){let list=myNotifications();return `${pagebar('Notifications')}<div class="section"><h1>Ce qui a changé.</h1><p class="muted space">Vos rendez-vous, à jour.</p>${list.some(n=>!n.read)?'<button class="textbtn space" data-action="notifications-read">Tout marquer comme lu</button>':''}${list.length?list.map(n=>`<article class="booking-row"><div class="row between"><h2 style="font-size:18px">${notificationTitle(n)}</h2><span class="badge">${n.read?'Lu':notificationEnabled(n)?'Nouveau':'Silencieux'}</span></div><p class="space">${notificationDescription(n)}</p><button class="pill light full space" data-action="notification-open" data-id="${n.id}">Voir la séance</button></article>`).join(''):'<div class="note space">Tout est à jour. Les prochaines réservations, modifications et annulations apparaîtront ici.</div>'}<p class="small muted space">Historique conservé dans ce navigateur. Aucun e-mail ni notification push n’est envoyé.${state.auth?.role==='coach'?' Vos réglages contrôlent les compteurs et les alertes dans l’agenda ; les événements restent consultables ici.':''}</p></div>`}

function netPaid(b){return Math.max(0,b.price-(b.refund||0))}
function ownedBooking(id){let b=bookingRecord(id);return b&&state.auth?.role!=='coach'&&b.customerId===currentCustomerId?b:null}
function editableGroup(id){let b=ownedBooking(id);return b?.groupSessionId&&b.status==='confirmed'&&hoursUntil(b)>0?b:null}
function bookingFingerprint(b){return JSON.stringify([b.id,b.status,b.groupSessionId,b.day,b.time,b.participants,b.unitPrice,b.price,b.refund||0,b.cancelHours])}
function courseFingerprint(g){return JSON.stringify([g.id,g.coach,g.status,g.serviceId,g.name,g.day,g.time,g.duration,g.unitPrice,g.format,g.location,g.cancelHours,g.preparation])}
function conflictsWithClient(day,time,duration,ignore){return clientBookings().some(x=>x.id!==ignore&&x.status==='confirmed'&&x.day===day&&overlaps(mins(x.time),x.duration||60,mins(time),duration))}
function transferProblem(b,g){if(!b||b.status!=='confirmed'||!b.groupSessionId)return 'Cette réservation ne peut plus être transférée.';if(hoursUntil(b)<(b.cancelHours??24))return 'Le transfert ferme à la limite d’annulation gratuite de votre réservation.';if(!g||g.id===b.groupSessionId||g.coach!==b.coach||!groupPublic(g))return 'Ce cours n’est plus ouvert au transfert.';if(groupSeats(g)<b.participants)return 'Il ne reste plus assez de places pour votre groupe.';if(conflictsWithClient(g.day,g.time,g.duration,b.id))return 'Vous avez déjà une séance à cette heure.';return ''}
function transferCandidates(b){return operations.groups.filter(g=>!transferProblem(b,g)).sort((a,b)=>a.day-b.day||mins(a.time)-mins(b.time))}
function financialPanel(b){return `<div class="receipt"><div class="row between"><span>Paiements cumulés · simulés</span><strong>${b.price} €</strong></div><div class="row between"><span>Remboursements cumulés</span><strong>− ${b.refund||0} €</strong></div><div class="row between total"><strong>Total net payé</strong><strong>${netPaid(b)} €</strong></div></div>${b.retainedFees&&netPaid(b)?`<p class="small muted">Dont ${Math.min(b.retainedFees,netPaid(b))} € conservés pour des places annulées hors délai.</p>`:''}`}

alertCandidates=function(a){let old={screen:state.screen,repeatOffer:state.repeatOffer,profileService:state.profileService,serviceFilter:state.serviceFilter};Object.assign(state,{screen:'explore',repeatOffer:null,profileService:null,serviceFilter:'Tous'});try{return finalBase.alertCandidates(a).filter(m=>(a.groupOnly?m.groupId&&groupSeats(groupById(m.groupId))>=(a.participants||1):!m.groupId||groupSeats(groupById(m.groupId))>=(a.participants||1))&&!state.bookings.some(b=>b.customerId===a.customerId&&b.status==='confirmed'&&b.day===m.day&&overlaps(mins(b.time),b.duration||60,mins(m.time),m.duration||primaryService(m.coach).duration)))}finally{Object.assign(state,old)}};
alertsPage=function(){let html=finalBase.alertsPage();return html.replaceAll('data-action="delete-alert"', 'data-action="delete-alert"')+`<div class="section">${operations.alerts.filter(a=>a.customerId===currentCustomerId&&a.status!=='booked').map(a=>`<button class="setting-row" data-action="alert-places" data-id="${a.id}"><span>${esc(alertDescription(a))}<small>${a.groupOnly?'Groupe uniquement · ':''}${a.participants||1} place(s) souhaitée(s) · ajuster</small></span>${ic('chevron')}</button>`).join('')}</div>`};
function temporalMaintenance(){extendDays();let changed=false;for(let b of state.bookings){if(b.status==='confirmed'&&hoursUntil(b)+(b.duration||60)/60<=0){b.status='completed';b.completedAutomatically=true;changed=true}let recorded=identity.refundLedger.filter(r=>r.bookingId===b.id).reduce((n,r)=>n+r.amount,0);if((b.refund||0)>recorded){identity.refundLedger.push({id:'refund-'+b.id+'-'+b.refund,bookingId:b.id,amount:b.refund-recorded,status:'pending',createdAt:appNow().getTime()});changed=true}if(b.status==='confirmed'&&hoursUntil(b)>0&&hoursUntil(b)<=24){for(let recipient of ['coach-'+b.coach,identity.accounts.find(a=>a.customerId===b.customerId)?.id].filter(Boolean)){let k=recipient+'|'+b.id+'|'+b.day+'|'+b.time;if(!identity.reminderKeys.includes(k)){identity.reminderKeys.push(k);let a=identity.accounts.find(x=>x.id===recipient),enabled=a?.role==='coach'?ownerConfig(a.coachId).notifications.reminder!==false:identity.customers[b.customerId]?.reminders!==false;if(enabled)customEvent(recipient,'Votre séance approche',dayLabel(b.day)+' à '+b.time+' · '+coaches[b.coach].name,{bookingId:b.id,category:'reminder'});changed=true}}}}
for(let p of Object.values(identity.configs)){let d=p.documentCase;if(d?.status==='approved'&&d.expires<parisISO()){d.status='expired';p.verified=false;p.published=false;changed=true}}
for(let p of identity.proposals){let b=bookingRecord(p.bookingId);if(p.status==='pending'&&(!b||b.status!=='confirmed'||hoursUntil(b)<=0||hoursUntil(p.to)<=0)){p.status='expired';changed=true}}
for(let a of operations.alerts.filter(a=>a.status==='active'&&a.day>=todayIndex())){let oldFilter=state.serviceFilter;state.serviceFilter='Tous';let matches=alertCandidates(a);state.serviceFilter=oldFilter;let keys=matches.map(m=>m.coach+'|'+m.day+'|'+m.time+'|'+(m.groupId||'solo')),fresh=keys.some(k=>!(a.seenMatches||[]).includes(k));if(JSON.stringify(keys)!==JSON.stringify(a.seenMatches)){a.seenMatches=keys;changed=true}if(fresh&&identity.customers[a.customerId]?.alertNotifications!==false){let recipient=identity.accounts.find(x=>x.customerId===a.customerId)?.id;if(recipient)customEvent(recipient,'Un créneau vous attend',dayLabel(a.day)+' · '+matches.length+' possibilité(s) pour '+(a.participants||1)+' personne(s).',{alertId:a.id,category:'availability'})}}
if(changed)persist()}
function demoTools(){return `${pagebar('Simulation Partant')}<div class="section"><h1>Tester les deux côtés.</h1><p class="muted space">Ces outils appartiennent au prototype. Les paiements et les identités restent fictifs dans les deux modes.</p><div class="stack space">${[['presentation','Présentation · parcours épuré'],['demo','Test · comptes et incidents']].map(([id,label])=>`<button class="choice ${runtime.mode===id?'active':''}" data-action="prototype-mode" data-id="${id}"><span class="radio"></span>${label}</button>`).join('')}</div><p class="note space">Horloge : ${appNow().toLocaleString('fr-FR',{timeZone:'Europe/Paris'})} · Paris</p>${runtime.mode==='demo'?`<button class="pill full space" data-action="accounts">Choisir un compte fictif</button><button class="pill light full space" data-action="operations">Ouvrir l’espace équipe</button><button class="pill light full space" data-action="advance-clock" data-id="24">Avancer de 24 h</button><button class="pill light full space" data-action="advance-clock" data-id="1">Avancer d’une heure</button>`:''}<button class="textbtn full space" data-action="real-clock">Revenir à l’heure réelle</button><p class="small muted space">Les rappels et alertes sont recalculés à l’ouverture d’un écran. Avancer l’horloge peut terminer des séances ; revenir à l’heure réelle n’annule pas les opérations enregistrées.</p></div>`}
function hiddenTestTools(){let hide=runtime.mode!=='demo';document.querySelectorAll('[data-action="accounts"],[data-action="use-account"],[data-action="scenario"],[data-action="operations"],[data-action="open-operations"],[data-action="complete-demo"],[data-action="coach-complete"],[data-action="coach-no-show"],[data-action="simulate-verification"],[data-action="reset-demo"]').forEach(el=>{el.hidden=hide;el.style.display=hide?'none':''})}
configPage=function(){if(state.configSection==='schedule')return schedulePage();if(state.configSection==='documents')return documentsPage();return finalBase.configPage()};
coachSession=function(id){finalBase.coachSession(id);let b=bookingRecord(id);if(!b)return;let el=document.getElementById('modal-content');if(el&&state.auth?.role==='coach'&&b.coach===activeCoachId){el.innerHTML+='<div class="section">'+proposalPanel(b)+refundPanel(b)+(b.status==='confirmed'&&hoursUntil(b)>0?`<button class="pill light full space" data-action="propose-change" data-id="${b.id}">Proposer un autre horaire / lieu</button>`:'')+'</div>'}hiddenTestTools()};
render=function(){temporalMaintenance();let special={payment:paymentPage,'payment-lost':paymentLost,'account-settings':accountSettings,proposal:proposalPage,'prototype-tools':demoTools};if(special[state.screen]){view.innerHTML='<div class="screen">'+special[state.screen]()+'</div>';nav();if(state.auth?.role==='coach')document.getElementById('nav').innerHTML=coachNavigation();document.getElementById('nav').classList.toggle('hidden',['payment','payment-lost','prototype-tools'].includes(state.screen))}else finalBase.render();if(['account','bookings'].includes(state.screen)&&signedClient()){let attempts=identity.payments.filter(p=>p.owner===actorId()&&['pending','refused','interrupted','expired'].includes(p.status));if(attempts.length)view.innerHTML+='<div class="section"><h2>Séances à confirmer</h2>'+attempts.slice(-3).reverse().map(p=>`<button class="setting-row" data-action="resume-payment" data-id="${p.id}"><span>${dayLabel(p.selection.day)} · ${p.selection.time}<small>${esc(coaches[p.selection.coach].name)} · ${p.selection.quotedTotal} € · aucun débit</small></span>${ic('chevron')}</button>`).join('')+'</div>'}if(state.screen==='detail'){let b=findBooking();view.innerHTML+=`<div class="section">${proposalPanel(b)}${refundPanel(b)}</div>`}if(state.screen==='welcome'||state.screen==='account'||state.screen==='coach'&&state.coachTab==='settings')view.innerHTML+='<div class="section"><button class="textbtn full" data-action="prototype-tools">À propos de la simulation</button>'+ (state.auth?'<button class="setting-row" data-action="account-settings"><span>Mon compte & mes données</span>'+ic('chevron')+'</button>':'')+'</div>';if(state.screen==='login')view.innerHTML+='<div class="section"><button class="textbtn full" data-action="recover-login">Recevoir un nouveau code / aide connexion</button>'+(state.pendingCheckout?'<div class="note">Votre sélection est conservée. <button class="textbtn full" data-action="entry-signup">Créer mon compte pour continuer</button></div>':'')+'</div>';hiddenTestTools()};
act=function(a,d={}){if(runtime.mode!=='demo'&&['accounts','use-account','scenario','operations','open-operations','complete-demo','coach-complete','coach-no-show','confirm-no-show','simulate-verification','confirm-reset'].includes(a)){toast('Ces outils sont accessibles dans À propos de la simulation → Test.');return}switch(a){
case 'prototype-tools':closeModal();go('prototype-tools');return;
case 'operations':closeModal();go('operations');return;
case 'prototype-mode':runtime.mode=d.id==='demo'?'demo':'presentation';saveRuntime();render();return;
case 'calendar-week':state.dateWindows??={};state.dateWindows[d.target]=Number(d.id);if(d.target==='modal-day')dateModal(state.dateMode,state.modalDate);else render();return;
case 'time':state.day=todayIndex()+(d.id==='tomorrow'?1:0);state.period=d.id==='evening'?'evening':'all';state.hour='';render();return;
case 'switch-client':if(runtime.mode==='presentation'){state.entryRole='client';state.entryMode='login';go('login');return}break;
case 'pay':beginPayment();return;
case 'book':case 'join-group':case 'alert-book':state.paymentAttempt=null;if(state.auth?.role==='coach'&&runtime.mode==='presentation'){state.entryRole='client';state.entryMode='login';go('login');toast('Connectez-vous côté particulier pour réserver.');return}break;
case 'payment-result':settlePayment(d.id);return;
case 'retry-payment':{let old=identity.payments.find(p=>p.id===state.paymentAttempt);if(old&&old.status!=='paid')old.status='replaced';state.paymentAttempt=null;beginPayment();return}
case 'resume-payment':{let p=identity.payments.find(p=>p.id===d.id&&p.owner===actorId());if(!p||p.status==='paid')return;state.booking=clone(p.selection);state.paymentAttempt=p.id;go('checkout');return}
case 'payment-summary':go('checkout');return;
case 'payment-reselect':{let b=state.booking;state.paymentAttempt=null;if(b?.groupSessionId){state.groupId=b.groupSessionId;go('group-details')}else if(b){state.coach=b.coach;go('profile')}else go('explore');return}
case 'settle-refund':{if(runtime.mode!=='demo')return;let r=identity.refundLedger.find(x=>x.id===d.id);if(r?.status==='pending'){r.status='confirmed';r.confirmedAt=appNow().getTime();persist();render()}return}
case 'customer-settings':case 'account-settings':go('account-settings');return;
case 'export-account':if(state.auth)downloadText('partant-mes-donnees.json',JSON.stringify(ownExport(),null,2),'application/json');return;
case 'delete-account':showModal('Supprimer ce compte local ?',`<p>Vos coordonnées et messages personnels seront supprimés de cette démonstration. Les références des séances restent dans l’historique de vos interlocuteurs. Traitez d’abord toute séance confirmée.</p><button class="pill full space" data-action="confirm-delete-account">Supprimer mon compte de démonstration</button><button class="textbtn full space" data-action="close">Conserver mon compte</button>`);return;
case 'confirm-delete-account':deleteOwnAccount();return;
case 'recover-login':showModal('Retrouver votre accès',`<p>Le prototype utilise le code <strong>123456</strong>. Aucun e-mail n’est envoyé.</p><p class="space">Vérifiez votre adresse et le rôle choisi. Vous pouvez utiliser Alex (alex@example.test) côté particulier, ou Thomas (thomas@example.test) côté coach.</p><button class="pill full space" data-action="close">Revenir à la connexion</button>`);return;
case 'add-exception':showModal('Une journée particulière',`<form id="exception-form">${selectField('Date','day',futureDays(),todayIndex())}<label class="check-row"><input type="checkbox" name="closed">Fermé toute la journée</label><div class="split">${inputField('Début','start','09:00','time')}${inputField('Fin','end','18:00','time')}</div><p class="small muted">Cette plage remplace la semaine type pour cette date.</p><p id="exception-error" role="alert"></p><button class="pill full space">Enregistrer l’exception</button></form>`);return;
case 'remove-exception':delete cfg.exceptions[Number(d.id)];cfg.daysOff=cfg.daysOff.filter(x=>x!==Number(d.id));persist();render();return;
case 'review-dossier':reviewDossier(Number(d.id));return;
case 'propose-change':proposalForm(d.id);return;
case 'open-proposal':state.proposalId=d.id;closeModal();go('proposal');return;
case 'proposal-answer':answerProposal(d.id);return;
case 'proposal-withdraw':{let p=proposalFor(state.proposalId),b=p&&bookingRecord(p.bookingId);if(p?.status==='pending'&&state.auth?.role==='coach'&&b.coach===activeCoachId){p.status='withdrawn';customEvent(identity.accounts.find(x=>x.customerId===b.customerId)?.id,'Proposition retirée','Votre séance initiale reste confirmée.',{bookingId:b.id,proposalId:p.id});persist();render()}return}
case 'notification-open':{let n=myNotifications().find(n=>n.id===d.id);if(n?.kind==='custom'){n.read=true;persist();if(n.proposalId){state.proposalId=n.proposalId;go('proposal')}else if(n.alertId)go('alerts');else if(n.bookingId){state.selectedBooking=n.bookingId;if(state.auth?.role==='coach')coachSession(n.bookingId);else go('detail')}else{state.configSection='documents';go('config')}return}break}
case 'alert-places':state.editAlert=d.id;showModal('Les places qui vous correspondent',`<form id="alert-places-form">${inputField('Participants souhaités','participants',operations.alerts.find(x=>x.id===d.id)?.participants||1,'number','min="1" max="20" required')}<label class="check-row"><input type="checkbox" name="groupOnly" ${operations.alerts.find(x=>x.id===d.id)?.groupOnly?'checked':''}>Chercher uniquement des cours en groupe</label><p class="small muted space">À plusieurs, cette alerte recherche des places dans un cours collectif.</p><button class="pill full space">Enregistrer</button></form>`);return;
case 'advance-clock':if(runtime.mode!=='demo')return;runtime.clock=new Date(appNow().getTime()+Number(d.id)*3600000).toISOString();saveRuntime();state.day=todayIndex();state.coachDay=todayIndex();render();return;
case 'real-clock':runtime.clock=null;saveRuntime();state.day=todayIndex();state.coachDay=todayIndex();render();return;
case 'logout':case 'guest':state.pendingCheckout=null;break;
}finalBase.act(a,d);if(a==='join-group'&&state.booking?.sourceAlert){let alert=operations.alerts.find(x=>x.id===state.booking.sourceAlert);if(alert){state.booking.participants=alert.participants||1;render()}}};
document.addEventListener('submit',e=>{let form=e.target;if(!['weekly-form','exception-form','account-form','documents-form','document-review-form','proposal-form','alert-places-form'].includes(form.id))return;e.preventDefault();let f=new FormData(form);
if(form.id==='weekly-form'){try{let list=Array.from({length:7},(_,d)=>parseIntervals(f,d));if(!list.some(x=>x.length))throw Error('Ouvrez au moins une journée.');cfg.intervals=list;cfg.week=list.map(x=>!!x.length);cfg.weeklyConfigured=true;cfg.checks.schedule=true;state.configDirty=false;persist();render();toast('Semaine enregistrée. Les séances confirmées sont conservées.')}catch(err){document.getElementById('weekly-error').textContent=err.message}}
if(form.id==='exception-form'){let d=Number(f.get('day')),a=f.get('start'),b=f.get('end'),closed=f.has('closed');if(d<todayIndex()||d>=todayIndex()+90||!closed&&(!/^\d\d:\d\d$/.test(a||'')||!/^\d\d:\d\d$/.test(b||'')||mins(a)>=mins(b))){document.getElementById('exception-error').textContent='Vérifiez la date et les horaires.';return}(cfg.exceptions??={})[d]=closed?[]:[[a,b]];cfg.daysOff=cfg.daysOff.filter(x=>x!==d);if(closed)cfg.daysOff.push(d);persist();closeModal();render()}
if(form.id==='account-form'){let a=identity.accounts.find(x=>x.id===actorId()),email=String(f.get('email')||'').trim().toLowerCase(),name=String(f.get('name')||'').trim();if(!a||!name||!/^\S+@\S+\.\S+$/.test(email)||identity.accounts.some(x=>x.id!==a.id&&x.role===a.role&&x.email===email)){document.getElementById('account-error').textContent='Vérifiez le nom et une adresse e-mail disponible.';return}a.email=email;a.phone=String(f.get('phone')||'').trim();state.auth={...a};if(a.role==='coach'){if(cfg.name!==name){cfg.name=name;cfg.verified=false;cfg.published=false;if(cfg.documentCase)cfg.documentCase.status='draft'}cfg.notifications.reminder=f.has('reminders')}else{customer.name=name;customer.reminders=f.has('reminders');customer.alertNotifications=f.has('alerts')}persist();render();toast('Informations enregistrées dans la démo.')}
if(form.id==='documents-form'){if(state.auth?.role!=='coach')return;let documents=[0,1,2,3].map(i=>String(f.get('doc-'+i)||'').trim()),expires=String(f.get('expires')||'');if(documents.some(x=>!x)||expires<=parisISO())return toast('Complétez les quatre références et une validité future.');let history=dossier().history||[];history.push({status:'pending',date:parisISO()});cfg.documentCase={status:'pending',documents,expires,history};cfg.verified=false;cfg.published=false;persist();render()}
if(form.id==='document-review-form'){if(runtime.mode!=='demo')return;let p=ownerConfig(state.reviewCoach),d=dossier(p),status=f.get('status'),reason=String(f.get('reason')||'').trim();if(d.status!=='pending'||!['approved','correction','rejected'].includes(status)||!reason)return;d.status=status;d.reason=reason;d.history.push({status,reason,date:parisISO()});p.verified=status==='approved'&&d.expires>=parisISO();if(!p.verified)p.published=false;customEvent('coach-'+state.reviewCoach,'Votre dossier a été examiné',docLabels[status]+' · '+reason);persist();closeModal();render()}
if(form.id==='proposal-form'){let b=bookingRecord(state.proposalBooking);if(state.auth?.role!=='coach'||b?.coach!==activeCoachId)return;let g=b.groupSessionId&&groupById(f.get('group')),to=g?{groupSessionId:g.id,day:g.day,time:g.time,duration:g.duration,format:g.format,serviceName:g.name,serviceId:g.serviceId,location:clone(g.location),preparation:clone(g.preparation||{}),cancelHours:b.cancelHours}:b.groupSessionId?null:{day:Number(f.get('day')),time:String(f.get('time')),location:{name:String(f.get('place')||'').trim(),address:String(f.get('address')||'').trim()}},reason=String(f.get('reason')||'').trim(),error=document.getElementById('proposal-error');if(!to||!reason||!to.location.name||!to.location.address){error.textContent='Complétez la proposition et son motif.';return}let issue=proposalIssue(b,to);if(issue){error.textContent=issue;return}for(let p of pendingProposals(b))p.status='withdrawn';let p={id:'proposal-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),bookingId:b.id,to,reason,status:'pending',fingerprint:JSON.stringify(bookingEventSnapshot(b)),locationFingerprint:JSON.stringify(locationFor(b)),createdAt:appNow().getTime()};identity.proposals.push(p);customEvent(identity.accounts.find(x=>x.customerId===b.customerId)?.id,'Votre coach propose un changement',reason,{bookingId:b.id,proposalId:p.id});persist();closeModal();state.proposalId=p.id;go('proposal')}
if(form.id==='alert-places-form'){let a=operations.alerts.find(x=>x.id===state.editAlert&&x.customerId===currentCustomerId),n=Number(f.get('participants'));if(!a||!Number.isInteger(n)||n<1||n>20)return;a.participants=n;a.groupOnly=f.has('groupOnly')||n>1;a.seenMatches=[];persist();closeModal();go('alerts')}
});
document.addEventListener('input',e=>{if(e.target.closest?.('#weekly-form'))state.configDirty=true});
state.day=Math.max(todayIndex(),state.day);state.coachDay=todayIndex();state.profileDay=todayIndex();
