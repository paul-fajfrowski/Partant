<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Votre code Partant</title></head>
<body style="margin:0;background:#f5f5f3;color:#141414;font-family:Arial,Helvetica,sans-serif">
  <main style="max-width:480px;margin:32px auto;padding:32px;background:#fff;border-radius:24px">
    <p style="font-size:28px;font-weight:700;margin:0 0 32px">partant</p>
    <h1 style="font-size:24px;margin:0 0 16px">Votre code de vérification</h1>
    <p style="line-height:1.6">Saisissez ce code dans Partant pour confirmer votre adresse e-mail et accéder à votre compte.</p>
    <p style="font-size:32px;letter-spacing:6px;font-weight:700;background:#f5f5f3;padding:20px;text-align:center;border-radius:16px">{{ .Token }}</p>
    <p style="line-height:1.6">Ce code est à usage unique. Ne le communiquez à personne. Si vous n’avez pas demandé ce code, ignorez cet e-mail.</p>
  </main>
</body></html>
